<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Graph Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #000000;
    font: 14px/1.5 ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  }

  .wrap { max-width: 1150px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .sub { color: #444444; font-size: 12.5px; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    border: 1px solid #000000; padding: 10px 12px;
  }
  .toolbar label { font-size: 12.5px; }
  .toolbar input[type="text"] {
    font-family: inherit; font-size: 13px; padding: 6px 9px;
    border: 1px solid #000000; background: #ffffff; color: #000000; min-width: 200px;
  }
  .toolbar button {
    font-family: inherit; font-weight: 700; font-size: 13px; padding: 7px 14px;
    border: 1px solid #000000; background: #ffffff; color: #000000; cursor: pointer;
  }
  .toolbar button:hover, .toolbar button:focus-visible { background: #000000; color: #ffffff; }
  .toolbar .stats { margin-left: auto; font-size: 12.5px; }

  #error {
    display: none; font-size: 13px; border: 1px solid #000000; padding: 8px 12px;
  }

  .panel { border: 1px solid #000000; }
  .diagram {
    min-height: 460px;
    background: #ffffff;
    padding: 20px;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .diagram svg { max-width: none; }
  .diagram .empty { font-size: 13px; align-self: center; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 14px;
    border-top: 1px solid #000000; font-size: 12.5px;
  }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .shape { width: 24px; height: 15px; flex: none; background: #ffffff; }
  .shape.entry { border: 2px solid #000000; border-radius: 999px; }
  .shape.screen { border: 1.5px solid #000000; }
  .shape.terminal { border: 3px double #000000; }
  .rule { width: 22px; height: 0; border-top: 2px solid #000000; }
  .rule.dashed { border-top-style: dashed; }

  details { border: 1px solid #000000; }
  details summary { cursor: pointer; padding: 10px 14px; font-size: 12.5px; font-weight: 700; }
  details pre {
    margin: 0; padding: 12px 14px; border-top: 1px solid #000000;
    font-size: 12px; overflow-x: auto; max-height: 320px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Flow Graph Viewer</h1>
      <div class="sub">GET /flows/{flowKey}/graph -&gt; rendered flowchart</div>
    </div>
  </header>

  <div class="toolbar">
    <label for="flowKey">Flow key</label>
    <input type="text" id="flowKey" value="AMB_REMINDER" autocomplete="off">
    <button id="load" type="button">Load</button>
    <span class="stats" id="stats"></span>
  </div>

  <div id="error"></div>

  <div class="panel">
    <div class="diagram" id="diagramHost"><span class="empty">Loading...</span></div>
    <div class="legend">
      <span class="item"><span class="shape entry"></span>entry screen</span>
      <span class="item"><span class="shape screen"></span>screen</span>
      <span class="item"><span class="shape terminal"></span>terminal (nfm_reply)</span>
      <span class="item"><span class="rule"></span>option / transition</span>
      <span class="item"><span class="rule dashed"></span>back target</span>
    </div>
  </div>

  <details>
    <summary>Raw JSON response</summary>
    <pre id="rawJson"></pre>
  </details>
</div>

<script>
(function () {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    themeVariables: {
      background: '#ffffff',
      primaryColor: '#ffffff',
      primaryBorderColor: '#000000',
      primaryTextColor: '#000000',
      lineColor: '#000000',
      edgeLabelBackground: '#ffffff',
      textColor: '#000000',
      fontFamily: 'ui-monospace, SFMono-Regular, Consolas, monospace',
      fontSize: '15px'
    },
    flowchart: {
      curve: 'linear',
      nodeSpacing: 55,
      rankSpacing: 75,
      htmlLabels: true
    }
  });

  function safeId(screenId) {
    return 'n_' + String(screenId).replace(/[^A-Za-z0-9_]/g, '_');
  }

  function sanitizeLabel(text) {
    if (text === null || text === undefined) return '';
    return String(text).replace(/"/g, '\\"').replace(/\n/g, ' ');
  }

  /**
   * Turns a FlowGraphView { flowKey, entryScreenId, nodes[], edges[] } into a Mermaid
   * flowchart definition. Node type is read from shape alone, not color, so the diagram
   * stays legible in plain black-and-white:
   *   - entry screen  -> stadium            (["label"])
   *   - TERMINAL node -> double-bordered box [["label"]]
   *   - everything else (SCREEN) -> plain box ["label"]
   * Edges: one solid, labeled arrow per flow_transition row in edges[]; one dashed arrow
   * per node.backTargetScreenId (BACK is a static jump the node itself carries, not a
   * customer-chosen option, so it isn't in edges[]).
   */
  function graphToMermaid(graph) {
    var nodes = graph.nodes || [];
    var edges = graph.edges || [];
    var entry = graph.entryScreenId;
    var idOf = {};
    nodes.forEach(function (n) { idOf[n.screenId] = safeId(n.screenId); });

    var lines = ['flowchart TD'];
    var entries = [];

    nodes.forEach(function (n) {
      var id = idOf[n.screenId];
      var label = sanitizeLabel(n.screenId);
      var isTerminal = n.nodeType === 'TERMINAL';
      var isEntry = n.screenId === entry;
      var shape = isEntry ? '(["' + label + '"])'
        : isTerminal ? '[["' + label + '"]]'
        : '["' + label + '"]';
      lines.push('  ' + id + shape);
      if (isEntry) entries.push(id);
    });

    edges.slice()
      .sort(function (a, b) {
        return a.fromScreenId.localeCompare(b.fromScreenId) || (a.displayOrder - b.displayOrder);
      })
      .forEach(function (e) {
        var from = idOf[e.fromScreenId], to = idOf[e.toScreenId];
        if (!from || !to) return;
        lines.push(e.optionLabel
          ? '  ' + from + ' -->|"' + sanitizeLabel(e.optionLabel) + '"| ' + to
          : '  ' + from + ' --> ' + to);
      });

    nodes.forEach(function (n) {
      if (n.backTargetScreenId && idOf[n.backTargetScreenId]) {
        lines.push('  ' + idOf[n.screenId] + ' -.->|back| ' + idOf[n.backTargetScreenId]);
      }
    });

    lines.push('  classDef default fill:#ffffff,stroke:#000000,color:#000000,stroke-width:1.5px;');
    if (entries.length) {
      lines.push('  classDef entry fill:#ffffff,stroke:#000000,color:#000000,stroke-width:3px;');
      lines.push('  class ' + entries.join(',') + ' entry;');
    }

    return lines.join('\n');
  }

  function setStats(graph) {
    var backCount = (graph.nodes || []).filter(function (n) { return !!n.backTargetScreenId; }).length;
    document.getElementById('stats').innerHTML =
      graph.nodes.length + ' screens, ' + graph.edges.length + ' options, ' +
      backCount + ' back-links, entry ' + graph.entryScreenId;
  }

  function showError(message) {
    var el = document.getElementById('error');
    el.textContent = message;
    el.style.display = message ? 'block' : 'none';
  }

  async function renderDiagram(source) {
    var host = document.getElementById('diagramHost');
    var result = await mermaid.render('flowDiagram', source);
    host.innerHTML = result.svg;
    if (typeof result.bindFunctions === 'function') result.bindFunctions(host);
  }

  async function load() {
    var flowKey = document.getElementById('flowKey').value.trim();
    if (!flowKey) return;
    showError('');
    document.getElementById('diagramHost').innerHTML = '<span class="empty">Loading...</span>';

    history.replaceState(null, '', '?flowKey=' + encodeURIComponent(flowKey));

    let response;
    try {
      response = await fetch('/flows/' + encodeURIComponent(flowKey) + '/graph');
    } catch (e) {
      showError('Request failed: ' + e.message);
      return;
    }
    let body;
    try {
      body = await response.json();
    } catch (e) {
      showError('Server did not return JSON (status ' + response.status + ')');
      return;
    }
    if (!response.ok) {
      showError(body.error || ('Request failed with status ' + response.status));
      return;
    }
    if (!Array.isArray(body.nodes) || !Array.isArray(body.edges)) {
      showError('Unexpected response shape - expected { nodes[], edges[] }');
      return;
    }

    document.getElementById('rawJson').textContent = JSON.stringify(body, null, 2);
    setStats(body);
    try {
      await renderDiagram(graphToMermaid(body));
    } catch (e) {
      showError('Could not render diagram: ' + e.message);
    }
  }

  document.getElementById('load').addEventListener('click', load);
  document.getElementById('flowKey').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') load();
  });

  var initialFlowKey = new URLSearchParams(location.search).get('flowKey');
  if (initialFlowKey) document.getElementById('flowKey').value = initialFlowKey;
  load();
})();
</script>
</body>
</html>
